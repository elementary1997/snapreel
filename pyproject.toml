[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapreel"
version = "0.6.1"
description = "Запись видео выделенной области экрана по хоткею с копированием файла в буфер обмена"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
daemon = ["pynput>=1.7"]
# ui — окна, иконка в трее и горячие клавиши: всё, что видит человек
ui = ["PySide6-Essentials>=6.6", "pynput>=1.7"]
dev = ["pytest>=8.0", "pynput>=1.7", "PySide6-Essentials>=6.6", "ruff>=0.6"]

[project.scripts]
snapreel = "snapreel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snapreel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# gui — тесты, открывающие настоящее окно. По умолчанию их нет в прогоне: на
# машине разработчика дисплей обычно есть, и на живом оконном менеджере они
# подвисают на захвате фокуса. Гоняются отдельно и только под Xvfb:
#   xvfb-run pytest -m gui        (в CI это делает job smoke)
markers = ["gui: требует дисплея, гоняется отдельно под Xvfb"]
addopts = "-m 'not gui'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F — базовые ошибки; I — порядок импортов; UP — современный синтаксис;
# B — bugbear; RUF — правила самого ruff (включая кириллицу в строках).
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "RUF001", # в строках намеренно кириллица: сообщения пользователю по-русски
    "RUF002",
    "RUF003",
]
