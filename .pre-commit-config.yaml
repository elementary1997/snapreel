# Необязательный, но полезный набор. Включить: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: sync-agent-rules
        name: правила агентов собраны из AGENTS.md
        entry: ./scripts/sync-agent-rules.sh --check
        language: system
        files: ^(AGENTS\.md|CLAUDE\.md|\.github/copilot-instructions\.md)$
        pass_filenames: false
