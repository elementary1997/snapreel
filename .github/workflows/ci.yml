name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Проект заявляет три платформы, поэтому и проверяется на трёх.
    # Тесты headless: ни экрана, ни ffmpeg, ни буфера обмена им не нужно.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

  smoke:
    # Сквозная проверка настоящей записи: x11grab по виртуальному экрану Xvfb.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps
        run: |
          sudo apt-get update
          # библиотеки Qt xcb: без них плагин не грузится, и окно не появится
          sudo apt-get install -y ffmpeg xvfb xclip python3-tk \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-xkb1 libxcb-shape0 libxcb-render-util0 libxcb-image0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Окну настроек и иконке в трее нужен настоящий дисплей, поэтому в
      # обычный прогон эти тесты не входят: единственный раннер с экраном —
      # этот. Трею тут поднимается свой мини-менеджер трея (см. тест).
      - name: Window tests on a virtual screen
        run: xvfb-run --server-args="-screen 0 1280x900x24" pytest -m gui -q

      - name: Record a clip on a virtual screen
        env:
          XDG_SESSION_TYPE: x11
        run: |
          # запись важнее буфера обмена: критерий успеха — непустой файл на диске
          xvfb-run --server-args="-screen 0 1280x720x24" \
            snapreel record --region 640x480+0+0 --seconds 2 --min-seconds 0 \
              --no-indicator --output-dir "$RUNNER_TEMP/clips" || true
          test -s "$RUNNER_TEMP"/clips/*.mp4
