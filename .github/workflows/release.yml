name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # старая glibc — бинарник заработает и на новых дистрибутивах
            label: linux-x86_64
            artifact: snapreel-linux-x86_64
          - os: macos-14 # Apple Silicon
            label: macos-arm64
            artifact: snapreel-macos-arm64
          - os: macos-15-intel # Intel; macos-13 выведен из эксплуатации
            label: macos-x86_64
            artifact: snapreel-macos-x86_64
          - os: windows-latest
            label: windows-x86_64
            artifact: snapreel-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg вшивается в бинарник, поэтому сначала собирается он сам.
      # Готовые сборки весят под 140 МБ — своя, только с нужным, около шести
      # (ADR-0006). Результат кешируется по содержимому сборочного скрипта:
      # пока он не менялся, релиз не пересобирает ffmpeg заново.
      - name: FFmpeg build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm xvfb \
            libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev libpulse-dev

      - name: FFmpeg build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: >-
            base-devel mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            make diffutils pkgconf tar git

      - name: Cache ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bin
          key: ffmpeg-${{ matrix.label }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: ./scripts/build-ffmpeg.sh

      - name: Build ffmpeg (msys2)
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg.sh

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[daemon]" pyinstaller

      - name: Build
        working-directory: packaging
        env:
          SNAPREEL_BUNDLE_FFMPEG: >-
            ${{ github.workspace }}/build/ffmpeg-bin/ffmpeg${{ runner.os == 'Windows' && '.exe' || '' }}
        run: pyinstaller snapreel.spec --noconfirm --distpath ../dist

      - name: Smoke test the binary
        shell: bash
        run: |
          bin="./dist/snapreel${{ runner.os == 'Windows' && '.exe' || '' }}"

          # бинарник обязан отвечать без установленного Python-окружения
          "$bin" --help
          "$bin" hotkey show

          # голый запуск — так бинарник стартует по двойному щелчку, и только
          # этот путь проходит через разбор аргументов записи. ffmpeg подменён
          # заведомо отсутствующим, чтобы отказ пришёл до оверлея выделения:
          # проверяем, что наружу выходит своё сообщение, а не трейсбек
          set +e
          bare="$(SNAPREEL_FFMPEG=snapreel-no-such-binary "$bin" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$bare"
          case "$bare" in
            *Traceback*) echo "трейсбек вместо сообщения пользователю"; exit 1;;
          esac
          case "$code" in
            1 | 2) ;;
            *) echo "ожидался отказ с кодом 1 или 2, получен $code"; exit 1;;
          esac

          # ffmpeg лежит внутри бинарника, а не в PATH: doctor обязан найти его
          # там же, где его будет искать запись. Вывод берётся отдельно: под
          # `-o pipefail` код doctor (а он вправе быть ненулевым, окружение
          # раннера неполное) перебил бы результат grep, и проверка молчала бы
          # всегда
          "$bin" doctor > doctor.txt || true
          cat doctor.txt
          if grep -qE '^ffmpeg +НЕ НАЙДЕН' doctor.txt; then
            echo "вшитый ffmpeg не нашёлся"; exit 1
          fi

      - name: Record a clip with the bundled ffmpeg
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: |
          # единственный раннер, которому можно поднять экран: здесь бандл
          # проверяется целиком — захват, libx264 и mp4 без внешних утилит
          xvfb-run --server-args="-screen 0 1280x720x24" \
            ./dist/snapreel record --region 640x480+0+0 --seconds 2 --min-seconds 0 \
              --no-indicator --output-dir "$RUNNER_TEMP/clips" || true
          test -s "$RUNNER_TEMP"/clips/*.mp4

      - name: Rename
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/snapreel.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/snapreel "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum snapreel-* > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "snapreel ${{ github.ref_name }}" \
            --notes "Готовые бинарники: ffmpeg внутри, ставить отдельно ничего не нужно.
          На Linux остаются системные утилиты буфера обмена — \`snapreel setup\` покажет команду.

          macOS: бинарник не подписан, при первом запуске снимите карантин:
          \`xattr -d com.apple.quarantine ./snapreel-macos-*\`

          Полный список изменений — CHANGELOG.md." \
            artifacts/*
