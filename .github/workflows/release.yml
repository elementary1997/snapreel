name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # никакой шаг здесь не идёт дольше сборки ffmpeg: на холодном кеше самое
    # медленное задание релиза 0.2.0 заняло восемь минут. Всё, что висит
    # дольше, висит зря — ждать шесть часов дефолтного таймаута незачем
    timeout-minutes: 40
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # старая glibc — бинарник заработает и на новых дистрибутивах
            label: linux-x86_64
            artifact: snapreel-linux-x86_64
          - os: macos-14 # Apple Silicon
            label: macos-arm64
            artifact: snapreel-macos-arm64
          - os: macos-15-intel # Intel; macos-13 выведен из эксплуатации
            label: macos-x86_64
            artifact: snapreel-macos-x86_64
          - os: windows-latest
            label: windows-x86_64
            artifact: snapreel-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg вшивается в бинарник, поэтому сначала собирается он сам.
      # Готовые сборки весят под 140 МБ — своя, только с нужным, около шести
      # (ADR-0006). Результат кешируется по содержимому сборочного скрипта:
      # пока он не менялся, релиз не пересобирает ffmpeg заново.
      - name: FFmpeg build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm xvfb \
            libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev libpulse-dev \
            libegl1 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-xkb1 libxcb-shape0 libxcb-render-util0 libxcb-image0

      - name: FFmpeg build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: >-
            base-devel mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            make diffutils pkgconf tar git

      - name: Cache ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-bin
          key: ffmpeg-${{ matrix.label }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: ./scripts/build-ffmpeg.sh

      - name: Build ffmpeg (msys2)
        if: steps.ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg.sh

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pyinstaller

      - name: Build
        working-directory: packaging
        env:
          SNAPREEL_BUNDLE_FFMPEG: >-
            ${{ github.workspace }}/build/ffmpeg-bin/ffmpeg${{ runner.os == 'Windows' && '.exe' || '' }}
        run: pyinstaller snapreel.spec --noconfirm --distpath ../dist

      - name: Smoke test the binary
        shell: bash
        run: |
          bin="./dist/snapreel${{ runner.os == 'Windows' && '.exe' || '' }}"

          # бинарник обязан отвечать без установленного Python-окружения
          "$bin" --help
          "$bin" hotkey show

          # запись с готовой геометрией: это единственный путь, который
          # проходит через разбор аргументов записи целиком, и он завершается
          # сам на любом раннере. ffmpeg подменён заведомо отсутствующим,
          # чтобы отказ пришёл до оверлея выделения: проверяем, что наружу
          # выходит своё сообщение, а не трейсбек.
          #
          # Голым запуском тут не проверить ничего: он поднимает трей или
          # окно установки и ждёт человека, а у macOS и Windows раннеров
          # графическая сессия есть. Его проверяет отдельный шаг на Linux,
          # где дисплея нет.
          "$bin" config > smoke-config.toml
          set +e
          refusal="$(SNAPREEL_FFMPEG=snapreel-no-such-binary "$bin" --config smoke-config.toml \
            record --region 320x240+0+0 --seconds 1 --min-seconds 0 --no-indicator 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$refusal"
          case "$refusal" in
            *Traceback*) echo "трейсбек вместо сообщения пользователю"; exit 1;;
          esac
          case "$code" in
            1 | 2) ;;
            *) echo "ожидался отказ с кодом 1 или 2, получен $code"; exit 1;;
          esac

          # ffmpeg лежит внутри бинарника, а не в PATH: doctor обязан найти его
          # там же, где его будет искать запись. Вывод берётся отдельно: под
          # `-o pipefail` код doctor (а он вправе быть ненулевым, окружение
          # раннера неполное) перебил бы результат grep, и проверка молчала бы
          # всегда
          "$bin" doctor > doctor.txt || true
          cat doctor.txt
          if grep -qE '^ffmpeg +НЕ НАЙДЕН' doctor.txt; then
            echo "вшитый ffmpeg не нашёлся"; exit 1
          fi

          # то же про окна и трей, но спрашиваем не doctor: `find_spec` находит
          # имя модуля в архиве бинарника даже тогда, когда его библиотеки туда
          # не попали, и отвечает «есть» на пустоту. Честный ответ даёт только
          # попытка открыть окно — без дисплея она обязана упереться в дисплей,
          # а не в отсутствующий PySide6
          set +e
          windowless="$("$bin" settings 2>&1)"
          set -e
          printf '%s\n' "$windowless"
          case "$windowless" in
            *"нет PySide6"* | *"No module named"*)
              echo "в бинарник не попал PySide6 — не будет ни окон, ни трея"; exit 1;;
          esac
          if ! grep -qE '^pynput +есть' doctor.txt; then
            echo "в бинарник не попал pynput — трей не услышит хоткеи"; exit 1
          fi

      - name: First run without a config
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: |
          # Первый запуск скачанного бинарника предлагает установить себя, и
          # это единственный путь, которым окно установки достаётся человеку.
          # На живом экране оно ждёт человека, поэтому критерий — «дожил до
          # таймаута»: значит окно собралось и открылось.
          home="$(mktemp -d)"
          set +e
          HOME="$home" XDG_CONFIG_HOME="$home/.config" \
            xvfb-run --server-args="-screen 0 1280x900x24" \
              timeout 15 ./dist/snapreel > first.log 2>&1
          code=$?
          set -e
          cat first.log

          if [ "$code" != "124" ]; then
            echo "окно установки не открылось: бинарник вышел с кодом $code"; exit 1
          fi
          case "$(cat first.log)" in
            *Traceback*) echo "трейсбек вместо окна"; exit 1;;
            *"No module named"*) echo "в бинарник не попало окно установки"; exit 1;;
          esac

          # а без графической сессии он обязан объяснить это словами: Qt в
          # такой ситуации убивает процесс сам, и человеку достался бы только
          # английский текст про платформенный плагин
          set +e
          blind="$(env -u DISPLAY -u WAYLAND_DISPLAY ./dist/snapreel 2>&1)"
          set -e
          printf '%s\n' "$blind"
          case "$blind" in
            *"нет графической сессии"*) ;;
            *) echo "без дисплея бинарник не объяснил, почему окна нет"; exit 1;;
          esac

      - name: Record a clip with the bundled ffmpeg
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: |
          # единственный раннер, которому можно поднять экран: здесь бандл
          # проверяется целиком — захват, libx264 и mp4 без внешних утилит
          xvfb-run --server-args="-screen 0 1280x720x24" \
            ./dist/snapreel record --region 640x480+0+0 --seconds 2 --min-seconds 0 \
              --no-indicator --output-dir "$RUNNER_TEMP/clips" || true
          test -s "$RUNNER_TEMP"/clips/*.mp4

      - name: Raise the tray icon on a virtual screen
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
        run: |
          # «PySide6 есть» в doctor значит лишь, что модуль внутри: платформенные
          # плагины Qt и бэкенды pynput выбираются в рантайме, и без них трей
          # поднимается немым — иконки нет, хоткеи не слушаются. Видно это
          # только на живом экране, поэтому здесь трей запускается по-настоящему.
          set +e
          xvfb-run --server-args="-screen 0 1280x720x24" \
            timeout 20 ./dist/snapreel tray > tray.log 2>&1
          code=$?
          set -e
          cat tray.log

          # 124 — трея дождался timeout, то есть процесс жил и работал.
          # Менеджера трея у Xvfb нет, и Qt честно об этом говорит — эту
          # строку мы и ищем ниже
          if [ "$code" != "124" ]; then
            echo "трей вышел сам с кодом $code, а должен был работать"; exit 1
          fi
          if grep -q "горячие клавиши не слушаем" tray.log; then
            echo "в бинарнике нет рабочего pynput — трей не услышит хоткеи"; exit 1
          fi
          # а про отсутствующий трей он обязан сказать: значит дошёл до цикла
          # событий и проверил, встала ли иконка
          if ! grep -q "иконка не появилась" tray.log; then
            echo "трей не доложил, что системного трея в сессии нет"; exit 1
          fi

      - name: Rename
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/snapreel.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/snapreel "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum snapreel-* > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "snapreel ${{ github.ref_name }}" \
            --notes "Готовые бинарники: ffmpeg внутри, ставить отдельно ничего не нужно.
          На Linux остаются системные утилиты буфера обмена — \`snapreel setup\` покажет команду.

          macOS: бинарник не подписан, при первом запуске снимите карантин:
          \`xattr -d com.apple.quarantine ./snapreel-macos-*\`

          Полный список изменений — CHANGELOG.md." \
            artifacts/*
